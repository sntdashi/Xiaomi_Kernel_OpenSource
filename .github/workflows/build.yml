name: Build Poco F6 OP Kernel (KVM + KSU Next)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b peridot-u-oss kernel-source

      - name: Unlock KVM & AVF
        run: |
          cd kernel-source
          # Masuk ke folder config GKI (Ini harus sebelum compile)
          CONF="arch/arm64/configs/gki_defconfig"
          echo "CONFIG_VIRTUALIZATION=y" >> $CONF
          echo "CONFIG_KVM=y" >> $CONF
          echo "CONFIG_KVM_ARM_HOST=y" >> $CONF
          echo "CONFIG_VHOST_NET=y" >> $CONF
          echo "CONFIG_OVERLAY_FS=y" >> $CONF
          echo "Pintunya udah dibuka bang!"

      - name: Inject KernelSU Next
        run: |
          cd kernel-source
          # Tarik KSU Next
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s next
          
          # TRIK SAKTI: Hapus baris yang manggil hwid/Kconfig karena filenya ga ada di repo
          # Kita pake '|| true' biar kalo barisnya ga ketemu, build ga stop
          sed -i '/hwid\/Kconfig/d' drivers/misc/Kconfig || true
          echo "Baris bermasalah di Kconfig udah dibabat!"

      - name: Build Kernel (GKI Mode)
        run: |
          cd kernel-source
          # 1. Generate config dari GKI yang udah di-patch tadi
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 2. Hajar compile!
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-KSU-Next-KVM-PocoF6
          path: kernel-source/out/arch/arm64/boot/Image
